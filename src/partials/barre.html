<!-- La barre n'en est plus une : deux pentes de toit qui se rejoignent au-dessus du faîtage. -->
<header class="barre">
  <i class="barre-toit" aria-hidden="true"></i>
  <a class="barre-logo" href="{{accueil}}" aria-label="{{nom}}, revenir à l’accueil">
    <img src="/img/logo/logo-barre.webp" width="450" height="218" alt="{{nom}}">
  </a>
  <div class="barre-actions">
    <button class="barre-menu" type="button" id="menu-ouvrir" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu">Menu</button>
    <a class="barre-tel" href="tel:{{telLien}}" aria-label="Appeler le {{tel}}">{{telEspaces}}</a>
    <a class="barre-devis" href="{{base}}#devis">Demander un devis</a>
  </div>
</header>
