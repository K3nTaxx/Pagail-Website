<!-- Chantier en grand -->
<dialog class="visionneuse" id="visionneuse" aria-label="Chantier en grand">
  <div class="visionneuse-photo" id="visionneuse-photo"></div>
  <button class="visionneuse-zone visionneuse-prec" id="visionneuse-prec" type="button" aria-label="Voir la photo précédente"></button>
  <button class="visionneuse-zone visionneuse-suiv" id="visionneuse-suiv" type="button" aria-label="Voir la photo suivante"></button>
  <div class="visionneuse-haut">
    <p class="visionneuse-titre titre" id="visionneuse-titre"></p>
    <button class="visionneuse-fermer" type="button" data-fermer autofocus>Fermer</button>
  </div>
  <div class="visionneuse-traits" id="visionneuse-traits"></div>
</dialog>
