<footer class="pied">
  <div class="pied-ligne">
    <img class="pied-logo" data-src="/img/logo/logo-complet.webp" width="488" height="342" alt="Logo de {{nom}}">
    <div class="pied-nap">
      <p class="pied-nom">{{nom}}</p>
      <p>{{zone}}.</p>
    </div>
    <div class="pied-contact">
      <a href="tel:{{telLien}}">{{telEspaces}}</a>
      <a href="mailto:{{email}}">{{email}}</a>
    </div>
    <button type="button" class="lien pied-legal" data-mentions>Mentions légales</button>
  </div>
  <nav class="pied-services" aria-label="Prestations">
    {{services}}
    {{lienAvis}}
  </nav>
</footer>
